// 🔧 ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getChapterKeys() { return Object.keys(historyDatabase); }
function getChapterTitle(key) { return historyDatabase[key]?.title || key; }
function getChapterParagraphs(key) { return historyDatabase[key]?.paragraphs || ''; }
function getChapterDesc(key) { return historyDatabase[key]?.desc || ''; }
function getChapterFullDesc(key) { return historyDatabase[key]?.fullDescription || getChapterDesc(key); }

function collectQuestions(keys) {
    let direct = [], reverse = [], oge = [], olympiad = [];
    keys.forEach(key => {
        const ch = historyDatabase[key];
        if (ch) {
            if (ch.schoolDirect) direct.push(...ch.schoolDirect);
            if (ch.schoolReverse) reverse.push(...ch.schoolReverse);
            if (ch.schoolOge) oge.push(...ch.schoolOge);
            if (ch.olympiad) olympiad.push(...ch.olympiad);
        }
    });
    return { direct, reverse, oge, olympiad };
}

// ============================================
function checkSavedLogin() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return false;
    try {
        const data = JSON.parse(stored);
        const now = Date.now();
        const maxAge = SESSION_DAYS * 24 * 60 * 60 * 1000;
        if (now - data.timestamp < maxAge) return true;
        else { localStorage.removeItem(STORAGE_KEY); return false; }
    } catch (e) { return false; }
}

function saveLogin() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ timestamp: Date.now() }));
}

function logout() {
    localStorage.removeItem(STORAGE_KEY);
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
    document.getElementById("passwordInput").value = "";
    document.getElementById("loginError").textContent = "";
}

function checkPassword() {
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("loginError");
    if (input.value === CORRECT_PASSWORD) {
        saveLogin();
        loginScreen.style.display = "none";
        gameContent.style.display = "block";
        showMainMenu();
    } else {
        error.textContent = "❌ Неверный пароль! Попробуйте ещё раз.";
        input.value = "";
        input.focus();
    }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
});

        </div>
        <h2>Гранд-Тренажёр по Истории Древнего Мира</h2>
        <p>Выбери режим исторической экспедиции:</p>
        <div class="options" style="margin: 30px 0;">
            ${optionsHtml}
        </div>
        ${renderCopyright()}
    `;
}

function startSetup(mode) {
    currentMode = mode;
    let keys = [];
    let title, desc;
    if (mode === 'all') {
        keys = getChapterKeys();
        title = "Глобальный марафон";
        desc = "Этот режим объединяет материалы всех глав. Тебе предстоит пройти масштабную проверку знаний, комбинируя прямые тесты, логический реверс и экзаменационные ловушки ОГЭ.";
    } else {
        if (historyDatabase[mode]) {
            keys = [mode];
            title = historyDatabase[mode].title;
            desc = getChapterFullDesc(mode);
        } else {
            showMainMenu();
            return;
        }
    }

    const { direct, reverse, oge, olympiad } = collectQuestions(keys);
    const shuffledDirect = shuffleArray(direct);
    const shuffledReverse = shuffleArray(reverse);
    const shuffledOge = shuffleArray(oge);
    olympiadQuestions = shuffleArray(olympiad);

    activePool = [...shuffledDirect, ...shuffledReverse, ...shuffledOge];
    baseLimit = activePool.length;
    currentIdx = 0;
    schoolScore = 0;
    olyScore = 0;
    playOlympiad = false;

    // Разбиваем описание на части для пошагового показа (только для Главы 3)
    briefingParts = [];
    if (mode === 'chapter3' && desc.includes('<!--SPLIT-->')) {
        const parts = desc.split('<!--SPLIT-->');
        briefingParts = parts.map(p => p.trim());
        // Если есть маркеры TRANSITION и SUMMARY, можно их убрать для красоты
        briefingParts = briefingParts.map(p => p.replace('<!--TRANSITION-->', '').replace('<!--SUMMARY-->', ''));
        currentPartIndex = 0;
        showBriefingPart(title, briefingParts[0], baseLimit, false);
    } else {
        // Для остальных глав показываем всё сразу
        briefingParts = [];
        showBriefing(title, desc, baseLimit);
    }
}

function showBriefingPart(title, content, count, isFinal) {
    // Если это последняя часть, то кнопка "АКТИВИРОВАТЬ ПРЫЖОК", иначе "ДАЛЕЕ →"
    const isLast = (currentPartIndex === briefingParts.length - 1);
    const btnText = isLast ? 'АКТИВИРОВАТЬ ПРЫЖОК' : 'ДАЛЕЕ →';
    const btnClass = isLast ? 'btn' : 'btn btn-secondary';

    gameContent.innerHTML = `
        <h1>🚀 ПОДГОТОВКА К ЗАПУСКУ 🚀</h1>
        <h2>Модуль: ${title}</h2>
        <div class="info-box"><strong>📖 Справка бортового компьютера:</strong><br>${content}</div>
        <p style="color: #60a5fa">Базовый экзаменационный блок содержит <b>${count} вопросов</b>.</p>
        <button class="${btnClass}" onclick="${isLast ? 'showQuestion()' : 'nextBriefingPart()'}">${btnText}</button>
    `;
}

function nextBriefingPart() {
    if (currentPartIndex < briefingParts.length - 1) {
        currentPartIndex++;
        showBriefingPart(
            getChapterTitle('chapter3'),
            briefingParts[currentPartIndex],
            baseLimit,
            currentPartIndex === briefingParts.length - 1
        );
    }
}

// Старый showBriefing для других глав (без разбиения)
function showBriefing(title, desc, count) {
    gameContent.innerHTML = `
        <h1>🚀 ПОДГОТОВКА К ЗАПУСКУ 🚀</h1><h2>Модуль: ${title}</h2>
        <div class="info-box"><strong>📖 Справка бортового компьютера:</strong><br>${desc}</div>
        <p style="color: #60a5fa">Базовый экзаменационный блок содержит <b>${count} вопросов</b>.</p>
        <button class="btn" onclick="showQuestion()">АКТИВИРОВАТЬ ПРЫЖОК</button>
    `;
}

// Остальные функции (showQuestion, checkAnswer, showOlyChoice, startOlympiad, getSchoolMark, showFinal)
// остаются без изменений – они уже были в предыдущих версиях.

// ============================================
// 🚀 СТАРТ
// ============================================
if (checkSavedLogin()) {
    loginScreen.style.display = "none";
    gameContent.style.display = "block";
    showMainMenu();
} else {
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
}
</script>
