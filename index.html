function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getChapterKeys() { return Object.keys(historyDatabase); }
function getChapterTitle(key) { return historyDatabase[key]?.title || key; }
function getChapterParagraphs(key) { return historyDatabase[key]?.paragraphs || ''; }
function getChapterDesc(key) { return historyDatabase[key]?.desc || ''; }
function getChapterFullDesc(key) { return historyDatabase[key]?.fullDescription || getChapterDesc(key); }

function collectQuestions(keys) {
    let direct = [], reverse = [], oge = [], olympiad = [];
    keys.forEach(key => {
        const ch = historyDatabase[key];
        if (ch) {
            if (ch.schoolDirect) direct.push(...ch.schoolDirect);
            if (ch.schoolReverse) reverse.push(...ch.schoolReverse);
            if (ch.schoolOge) oge.push(...ch.schoolOge);
            if (ch.olympiad) olympiad.push(...ch.olympiad);
        }
    });
    return { direct, reverse, oge, olympiad };
}

function checkSavedLogin() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return false;
    try {
        const data = JSON.parse(stored);
        const now = Date.now();
        const maxAge = SESSION_DAYS * 24 * 60 * 60 * 1000;
        if (now - data.timestamp < maxAge) return true;
        else { localStorage.removeItem(STORAGE_KEY); return false; }
    } catch (e) { return false; }
}

function saveLogin() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ timestamp: Date.now() }));
}

function logout() {
    localStorage.removeItem(STORAGE_KEY);
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
    document.getElementById("passwordInput").value = "";
    document.getElementById("loginError").textContent = "";
}

function checkPassword() {
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("loginError");
    if (input.value === CORRECT_PASSWORD) {
        saveLogin();
        loginScreen.style.display = "none";
        gameContent.style.display = "block";
        showMainMenu();
    } else {
        error.textContent = "❌ Неверный пароль! Попробуйте ещё раз.";
        input.value = "";
        input.focus();
    }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
});

function startSetup(mode) {
    currentMode = mode;
    currentChapter = mode;
    let keys = [];
    let title, desc;
    if (mode === 'all') {
        keys = getChapterKeys();
        title = "Глобальный марафон";
        desc = "Этот режим объединяет материалы всех глав. Тебе предстоит пройти масштабную проверку знаний, комбинируя прямые тесты, логический реверс и экзаменационные ловушки ОГЭ.";
    } else {
        if (historyDatabase[mode]) {
            keys = [mode];
            title = historyDatabase[mode].title;
            desc = getChapterFullDesc(mode);
        } else {
            showMainMenu();
            return;
        }
    }

    // Для Главы 3 особая логика – показываем переход и меню разделов
    if (mode === 'chapter3') {
        // Сбрасываем прогресс разделов
        completedParts = [false, false, false];
        schoolScore = 0;
        olyScore = 0;
        playOlympiad = false;
        // Разбиваем описание на части
        briefingParts = [];
        if (desc.includes('<!--SPLIT-->')) {
            const parts = desc.split('<!--SPLIT-->');
            briefingParts = parts.map(p => p.trim()).map(p => p.replace('<!--TRANSITION-->', '').replace('<!--SUMMARY-->', ''));
            currentPartIndex = 0;
            showChapter3Intro(title, briefingParts[0]);
        } else {
            // на случай, если разбивки нет
            showPartMenu();
        }
        return;
    }

    // Для других глав и марафона – обычная логика
    const { direct, reverse, oge, olympiad } = collectQuestions(keys);
    const shuffledDirect = shuffleArray(direct);
    const shuffledReverse = shuffleArray(reverse);
    const shuffledOge = shuffleArray(oge);
    olympiadQuestions = shuffleArray(olympiad);

    activePool = [...shuffledDirect, ...shuffledReverse, ...shuffledOge];
    baseLimit = activePool.length;
    currentIdx = 0;
    schoolScore = 0;
    olyScore = 0;
    playOlympiad = false;

    showBriefing(title, desc, baseLimit);
}

        <h2>Модуль: ${title}</h2>
        <div class="info-box"><strong>📖 Справка бортового компьютера:</strong><br>${content}</div>
        <p style="color: #60a5fa;">Чтобы лучше усвоить материал, Глава 3 разбита на три раздела. Ты можешь проходить их в любом порядке.</p>
        <button class="btn" onclick="showPartMenu()">ДАЛЕЕ →</button>
    `;
}

// ---- Меню выбора раздела (Глава 3) ----
function showPartMenu() {
    const partTitles = [
        "Раздел 1. География и объединение Египта",
        "Раздел 2. Общество и религия",
        "Раздел 3. Культура и достижения"
    ];
    const partDescs = [
        "§5–6: Нил, объединение, фараон, двойная корона",
        "§7–9: Социальное устройство, боги, загробная жизнь, мумии",
        "§10: Пирамиды, иероглифы, папирус, календарь"
    ];
    const status = completedParts.map(done => done ? '✅' : '⬜');

    let html = `
        <h1>🏛️ ДРЕВНИЙ ЕГИПЕТ</h1>
        <h2>Выбери раздел для изучения</h2>
        <div class="part-menu">
    `;
    for (let i = 0; i < totalParts; i++) {
        html += `
            <button class="part-btn" onclick="startPart(${i+1})">
                <div class="part-label">${status[i]} ${partTitles[i]}</div>
                <div style="font-size:13px; color:#9ca3af;">${partDescs[i]}</div>
                <div style="font-size:12px; color:#6b7280; margin-top:4px;">${completedParts[i] ? 'Пройден' : 'Не пройден'}</div>
            </button>
        `;
    }
    html += `
        </div>
        <button class="btn btn-secondary" onclick="showMainMenu()" style="margin-top:10px;">🏠 В главное меню</button>
    `;
    gameContent.innerHTML = html;
}

// ---- Запуск раздела ----
function startPart(partNumber) {
    if (completedParts[partNumber-1]) {
        // Если уже пройден, можно предложить пройти заново или вернуться
        if (!confirm(`Раздел ${partNumber} уже пройден. Пройти его заново?`)) {
            return;
        }
        // Сбросить флаг пройденности, чтобы можно было перепройти
        completedParts[partNumber-1] = false;
    }
    currentPartNumber = partNumber;
    const partKey = 'part' + partNumber;
    const partData = historyDatabase.chapter3.parts[partKey];
    if (!partData) {
        alert('Ошибка: раздел не найден');
        return;
    }

    // Собираем вопросы из раздела
    const direct = shuffleArray(partData.questions.schoolDirect || []);
    const reverse = shuffleArray(partData.questions.schoolReverse || []);
    const oge = shuffleArray(partData.questions.schoolOge || []);
    activePool = [...direct, ...reverse, ...oge];
    baseLimit = activePool.length;
    currentIdx = 0;
    // Олимпиаду для раздела не добавляем, она будет после всех разделов
    playOlympiad = false;
    olympiadQuestions = []; // пока пусто

    // Показываем краткое описание раздела и запускаем вопросы
    showBriefing(partData.title, `В этом разделе тебе предстоит ответить на ${baseLimit} вопросов. Удачи!`, baseLimit);
}

// ---- Показ брифинга перед вопросами ----
function showBriefing(title, desc, count) {
    gameContent.innerHTML = `
        <h1>🚀 ПОДГОТОВКА К ЗАПУСКУ 🚀</h1>
        <h2>${title}</h2>
        <div class="info-box"><strong>📖 Справка:</strong><br>${desc}</div>
        <p style="color: #60a5fa">В этом разделе <b>${count} вопросов</b>.</p>
        <button class="btn" onclick="showQuestion()">НАЧАТЬ ТЕСТ</button>
    `;
}

// ---- Вопросы (общая логика) ----
let currentShuffledCorrectIndex = -1;

function showQuestion() {
    if (!playOlympiad && currentIdx >= baseLimit) {
        // Закончился базовый блок (раздел)
        finishPart();
        return;
    }
    if (playOlympiad && currentIdx >= activePool.length) {
        showFinal();
        return;
    }

    const qObj = activePool[currentIdx];
    const progressPct = ((currentIdx) / activePool.length) * 100;

    let pTag = '';
    if (qObj.p) {
        pTag = `<div class="p-tag">📖 §${qObj.p}</div>`;
    }

    let tagHtml = '';
    if (!playOlympiad) {
        const part = Math.floor(baseLimit / 3);
        const remainder = baseLimit % 3;
        let roundNum = 1;
        if (currentIdx < part) roundNum = 1;
        else if (currentIdx < 2 * part + (remainder >= 1 ? 1 : 0)) roundNum = 2;
        else roundNum = 3;
        const roundNames = ['Прямой тест', 'Логический реверс', 'Формат ОГЭ'];
        const roundClasses = ['round1-tag', 'round2-tag', 'round3-tag'];
        const roundIcons = ['🟢', '🔴', '🔵'];
        const idx = roundNum - 1;
        tagHtml = `<span class="round-tag ${roundClasses[idx]}">${roundIcons[idx]} Раунд ${roundNum}: ${roundNames[idx]} (${currentIdx + 1}/${baseLimit})</span>`;
    } else {
        const olyCur = currentIdx - baseLimit + 1;
        const olyTot = olympiadQuestions.length;
        tagHtml = `<span class="round-tag" style="background-color:#7c2d12; color:#fed7aa;">🏆 Раунд 4: Олимпиада (${olyCur}/${olyTot})</span>`;
    }

    const originalAnswers = qObj.a;
    const shuffled = shuffleArray(originalAnswers);
    const correctAnswerText = originalAnswers[qObj.c];
    const shuffledCorrectIdx = shuffled.indexOf(correctAnswerText);
    currentShuffledCorrectIndex = shuffledCorrectIdx;

    let html = `<div class="progress-bar"><div class="progress" style="width: ${progressPct}%"></div></div>`;
    html += tagHtml;
    html += pTag;
    html += `<h3 style="margin-top:10px; line-height:1.4;">${qObj.q}</h3>`;
    html += `<div class="options">`;
    shuffled.forEach((opt, idx) => {
        html += `<button class="option-btn" onclick="checkAnswer(${idx})">${idx + 1}) ${opt}</button>`;
    });
    html += `</div><div class="feedback" id="feedback"></div>`;
    gameContent.innerHTML = html;
}

function checkAnswer(chosenIdx) {
    const qObj = activePool[currentIdx];
    const fDiv = document.getElementById("feedback");
    const btns = document.querySelectorAll(".option-btn");
    btns.forEach(b => b.disabled = true);

    if (chosenIdx === currentShuffledCorrectIndex) {
        if (currentIdx < baseLimit) schoolScore++;
        else olyScore++;
        fDiv.innerHTML = `<span style="color:#10b981">✅ ${qObj.f}</span>`;
        btns[chosenIdx].style.background = "#065f46";
        btns[chosenIdx].style.borderColor = "#10b981";
    } else {
        const correctAnswerText = qObj.a[qObj.c];
        fDiv.innerHTML = `
            <div style="color:#ef4444;">❌ Неверно! Правильный ответ: <b>${correctAnswerText}</b></div>
            <div class="explanation-box">📖 <b>Объяснение:</b> ${qObj.f}</div>
        `;
        btns[chosenIdx].style.background = "#991b1b";
        btns[chosenIdx].style.borderColor = "#ef4444";
        btns[currentShuffledCorrectIndex].style.background = "#065f46";
    }

    currentIdx++;
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn";
    if (!playOlympiad) {
        if (currentIdx < baseLimit) {
            const part = Math.floor(baseLimit / 3);
            const remainder = baseLimit % 3;
            let nextRound = 1;
            if (currentIdx < part) nextRound = 1;
            else if (currentIdx < 2 * part + (remainder >= 1 ? 1 : 0)) nextRound = 2;
            else nextRound = 3;
            const nextRoundNames = ['ПРЯМОЙ ТЕСТ', 'ЛОГИЧЕСКИЙ РЕВЕРС', 'ФОРМАТ ОГЭ'];
            nextBtn.innerText = `ДАЛЕЕ (Раунд ${nextRound})`;
        } else {
            nextBtn.innerText = "ЗАВЕРШИТЬ РАЗДЕЛ";
        }
    } else {
        if (currentIdx < activePool.length) {
            nextBtn.innerText = "ДАЛЕЕ (Олимпиада)";
        } else {
            nextBtn.innerText = "ЗАВЕРШИТЬ ИГРУ";
        }
    }
    nextBtn.onclick = showQuestion;
    gameContent.appendChild(nextBtn);
}

// ---- Завершение раздела ----
function finishPart() {
    completedParts[currentPartNumber-1] = true;
    const allDone = completedParts.every(v => v === true);
    const totalQuestions = baseLimit; // количество вопросов в этом разделе

    let html = `
        <h1>🏁 Раздел пройден!</h1>
        <h2>${historyDatabase.chapter3.parts['part'+currentPartNumber].title}</h2>
        <div class="info-box" style="border-color:#10b981; text-align:center;">
            <span style="font-size:18px;">Твой результат: <b>${schoolScore}</b> баллов<br>
            (из ${totalQuestions} вопросов в этом разделе)</span>
        </div>
        <p style="color:#9ca3af;">Прогресс по Главе 3: <b>${completedParts.filter(Boolean).length} из ${totalParts}</b> разделов пройдено.</p>
    `;

    // Кнопки действий
    if (!allDone) {
        // Есть непройденные разделы
        html += `
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:15px;">
                <button class="btn btn-success" onclick="showPartMenu()">📋 ВЫБРАТЬ ДРУГОЙ РАЗДЕЛ</button>
                <button class="btn btn-secondary" onclick="showMainMenu()">🏠 В ГЛАВНОЕ МЕНЮ</button>
            </div>
        `;
    } else {
        // Все разделы пройдены – предлагаем олимпиаду
        html += `
            <p style="color:#fcd34d; margin-top:15px;">🎉 Ты прошёл все разделы! Готов проверить свои знания на олимпиадном уровне?</p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px;">
                <button class="btn" style="background:linear-gradient(to right, #b45309, #7c2d12);" onclick="startOlympiad()">🏆 ОЛИМПИАДА</button>
                <button class="btn btn-secondary" onclick="showMainMenu()">🏠 В ГЛАВНОЕ МЕНЮ</button>
            </div>
        `;
    }

    gameContent.innerHTML = html;
}

// ---- Запуск олимпиады (для Главы 3) ----
function startOlympiad() {
    const oly = historyDatabase.chapter3.olympiad || [];
    if (oly.length === 0) {
        alert('Олимпиадных заданий для этой главы нет.');
        return;
    }
    playOlympiad = true;
    olympiadQuestions = shuffleArray(oly);
    activePool = activePool.concat(olympiadQuestions); // добавляем в конец
    // currentIdx уже указывает на конец базового блока (baseLimit)
    showQuestion();
}

// ---- Финал (после олимпиады или если олимпиады нет) ----
function showFinal() {
    const olyLimit = olympiadQuestions.length;
    const schoolMark = getSchoolMark(schoolScore, baseLimit);
    let html = `<h1>🏁 СУПЕР-МАРАФОН ЗАВЕРШЕН! 🏁</h1><h2>Экзаменационная ведомость:</h2><div class="info-box" style="border-color: #3b82f6;">`;
    html += `<div class="result-item">🏫 <b>Школьная программа + ОГЭ:</b> <span>${schoolScore} из ${baseLimit} баллов</span> — <b style="color:#10b981">${schoolMark}</b></div>`;
    if (playOlympiad && olyLimit > 0) {
        const olyMark = olyScore === olyLimit ? "Победитель олимпиады" : (olyScore >= (olyLimit * 0.6) ? "Призёр олимпиады" : "Участник");
        html += `<div class="result-item" style="border-left:4px solid #f59e0b;">🏆 <b>Олимпиадный уровень:</b> <span>${olyScore} из ${olyLimit} баллов</span> — <b style="color:#f59e0b">${olyMark}</b></div>`;
        html += `<div class="result-item" style="background:#111827; text-align:center; margin-top:15px;">👑 <b>ОБЩИЙ ИТОГОВЫЙ СЧЁТ:</b> <span style="color:#f59e0b; font-weight:bold;">${schoolScore + olyScore} из ${baseLimit + olyLimit} баллов</span></div>`;
    } else {
        html += `<div class="result-item" style="color:#9ca3af; text-align:center;">🎯 <i>Олимпиадный раунд не был выбран или отсутствовал.</i></div>`;
    }
    html += `</div>`;
    html += renderCopyright();
    html += `<button class="btn" onclick="showMainMenu()">В ГЛАВНОЕ МЕНЮ</button>`;
    gameContent.innerHTML = html;
}

function getSchoolMark(s, limit) {
    const pct = (s / limit) * 100;
    if (pct === 100) return "5+++ (Магистр ОГЭ)";
    if (pct >= 80) return "5 (Отлично)";
    if (pct >= 50) return "4 (Хорошо)";
    return "3 (Нужно повторить)";
}

// ============================================
// 🚀 СТАРТ
// ============================================
if (checkSavedLogin()) {
    loginScreen.style.display = "none";
    gameContent.style.display = "block";
    showMainMenu();
} else {
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
}
</script>
