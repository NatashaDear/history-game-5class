            { q: "<b>Задание ОГЭ на причинно-следственные связи.</b><br>Переход к производящему хозяйству называют 'неолитической революцией'. Что стало её главным следствием?", a: ["Люди перестали использовать огонь", "Появились поселения, ремёсла, неравенство", "Все переселились в Африку"], c: 1, f: "Верно! Производство еды изменило общество." },
            { q: "<b>Задание ОГЭ на анализ источника.</b><br>Археологи нашли захоронение: в одной могиле золото, в других – черепки. Какой вывод?", a: ["Все были равны", "Появилось имущественное неравенство", "Люди не любили золото"], c: 1, f: "Блестяще! Это признак социального расслоения." },
            { q: "<b>Задание ОГЭ на группировку понятий.</b><br>Какое понятие объединяет 'мотыга', 'серп', 'зернотерка'?", a: ["Орудия земледельцев", "Оружие", "Предметы роскоши"], c: 0, f: "Точно! Это орудия труда земледельцев." },
            { q: "<b>Задание ОГЭ на логику.</b><br>С появлением излишков еды общины начали воевать. Кто становился во главе племени во время войн?", a: ["Самый молодой", "Военный вождь", "Случайный человек"], c: 1, f: "Отлично! Вожди забирали лучшую добычу." }
        ],
        olympiad: [
            { q: "<b>Олимпиадный этимологический анализ.</b><br>Почему переход к земледелию называют 'неолитической революцией'?", a: ["Из-за битв на полях", "Потому что изменил всё", "Из-за изобретения колеса"], c: 1, f: "Превосходно! Масштаб изменений – революционный." },
            { q: "<b>Логика религиозных культов.</b><br>У земледельцев – культ богини-матери, у скотоводов – Быка. Чем объясняется разница?", a: ["Случайностью", "Зависимостью религии от хозяйства", "Разными планетами"], c: 1, f: "В точку! Хозяйство определяет верования." },
            { q: "<b>Археологическое моделирование.</b><br>На раскопках нашли крупные зёрна – что это значит?", a: ["Они разбухли от влаги", "Люди занимались селекцией", "Это подделка"], c: 1, f: "Блестяще! Древние отбирали лучшие семена." },
            { q: "<b>Критический анализ мифов.</b><br>Миф об изгнании из Рая отражает:", a: ["Полёты в космос", "Тяжёлый труд земледельца", "Отсутствие дождей"], c: 1, f: "Верно! Труд земледельца был очень тяжёлым." },
            { q: "<b>Технологическая цепочка.</b><br>Правильная последовательность: 1. Излишки, 2. Производство, 3. Неравенство, 4. Государство.", a: ["1-2-3-4", "2-1-4-3", "4-3-2-1"], c: 1, f: "Абсолютно! Производство → излишки → неравенство → государство." }
        ]
    }
    // 👇 НОВЫЕ ГЛАВЫ ДОБАВЛЯЙТЕ СЮДА (просто скопируйте блок выше и измените ключ, title, desc и вопросы)
};

// ============================================
// 🔧 ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getChapterKeys() {
    return Object.keys(historyDatabase);
}

function getChapterTitle(key) {
    return historyDatabase[key]?.title || key;
}

function getChapterDesc(key) {
    return historyDatabase[key]?.desc || '';
}

// Собрать все вопросы из выбранных глав по типам
function collectQuestions(keys) {
    let direct = [], reverse = [], oge = [], olympiad = [];
    keys.forEach(key => {
        const ch = historyDatabase[key];
        if (ch) {
            if (ch.schoolDirect) direct.push(...ch.schoolDirect);
            if (ch.schoolReverse) reverse.push(...ch.schoolReverse);
            if (ch.schoolOge) oge.push(...ch.schoolOge);
            if (ch.olympiad) olympiad.push(...ch.olympiad);
        }
    });
    return { direct, reverse, oge, olympiad };
}

// ============================================
// 🔐 ЛОГИКА ПАРОЛЯ И localStorage
// ============================================
function checkSavedLogin() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return false;
    try {
        const data = JSON.parse(stored);
        const now = Date.now();
        const maxAge = SESSION_DAYS * 24 * 60 * 60 * 1000;
        if (now - data.timestamp < maxAge) return true;
        else { localStorage.removeItem(STORAGE_KEY); return false; }
    } catch (e) { return false; }
}

function saveLogin() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ timestamp: Date.now() }));
}

function logout() {
    localStorage.removeItem(STORAGE_KEY);
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
    document.getElementById("passwordInput").value = "";
    document.getElementById("loginError").textContent = "";
}

function checkPassword() {
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("loginError");
    if (input.value === CORRECT_PASSWORD) {
        saveLogin();
        loginScreen.style.display = "none";
        gameContent.style.display = "block";
        showMainMenu();
    } else {
        error.textContent = "❌ Неверный пароль! Попробуйте ещё раз.";
        input.value = "";
        input.focus();
    }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
});

// ============================================
// 🎮 ОСНОВНАЯ ИГРОВАЯ ЛОГИКА
// ============================================
let activePool = [];
let currentIdx = 0;
let schoolScore = 0;
let olyScore = 0;
let playOlympiad = false;
let currentMode = null; // 'all' или имя конкретной главы
let baseLimit = 0;
let olympiadQuestions = [];

const gameContent = document.getElementById("gameContent");
const loginScreen = document.getElementById("loginScreen");

function renderCopyright() {
    return `
        <div class="footer-copyright">
            © 2026, некоммерческий образовательный проект.<br>
            <strong>Разработчик и методист: Пятина Наталья Владимировна</strong><br>
            Все права на исторический материал принадлежат авторам учебника 
            «Всеобщая история. История Древнего мира. 5 класс» 
            <strong>В.Р. Мединскому</strong> и <strong>А.О. Чубарьяну</strong>.<br>
            Коммерческое использование игры запрещено без письменного согласия правообладателей.
        </div>
    `;
}

function showMainMenu() {
    const keys = getChapterKeys();
    let optionsHtml = '';
    keys.forEach(key => {
        const title = getChapterTitle(key);
        const desc = getChapterDesc(key);
        // берём короткое описание
        const shortDesc = desc.length > 80 ? desc.substring(0, 80) + '...' : desc;
        optionsHtml += `
            <button class="option-btn" style="border-left: 5px solid #3b82f6;" onclick="startSetup('${key}')">
                <b>📁 ${title}</b><br>
                <span style="font-size:13px; color:#9ca3af;">${shortDesc}</span>
            </button>
        `;
    });
    // Кнопка глобального марафона
    optionsHtml += `
        <button class="option-btn" style="border-left: 5px solid #f59e0b; background: linear-gradient(145deg, #1e293b, #2d3748);" onclick="startSetup('all')">
            <b>👑 ГЛОБАЛЬНЫЙ МАРАФОН (ВСЕ ГЛАВЫ)</b><br>
            <span style="font-size:13px; color:#fcd34d;">Супер-экзамен по всей пройденной истории. Без пощады!</span>
        </button>
    `;

    gameContent.innerHTML = `
        <div class="menu-header">
            <h1 style="margin:0;">⏱️ 🚀 МАШИНА ВРЕМЕНИ 6.5 🚀 ⏱️</h1>
            <button class="logout-btn" onclick="logout()" title="Выйти и очистить сохранённый доступ">🚪 Выйти</button>
        </div>
        <h2>Гранд-Тренажёр по Истории Древнего Мира</h2>
        <p>Выбери режим исторической экспедиции:</p>
        <div class="options" style="margin: 30px 0;">
            ${optionsHtml}
        </div>
        ${renderCopyright()}
    `;
}

function startSetup(mode) {
    currentMode = mode;
    let keys = [];
    let title, desc;
    if (mode === 'all') {
        keys = getChapterKeys();
        title = "Глобальный марафон";
        desc = "Этот режим объединяет материалы всех глав. Тебе предстоит пройти масштабную проверку знаний, комбинируя прямые тесты, логический реверс и экзаменационные ловушки ОГЭ.";
    } else {
        if (historyDatabase[mode]) {
            keys = [mode];
            title = historyDatabase[mode].title;
            desc = historyDatabase[mode].desc;
        } else {
            // если глава не найдена, возвращаемся в меню
            showMainMenu();
            return;
        }
    }

    // Собираем вопросы
    const { direct, reverse, oge, olympiad } = collectQuestions(keys);
    // Перемешиваем каждый тип отдельно
    const shuffledDirect = shuffleArray(direct);
    const shuffledReverse = shuffleArray(reverse);
    const shuffledOge = shuffleArray(oge);
    olympiadQuestions = shuffleArray(olympiad); // сохраняем для олимпиадного раунда

    activePool = [...shuffledDirect, ...shuffledReverse, ...shuffledOge];
    baseLimit = activePool.length;
    currentIdx = 0;
    schoolScore = 0;
    olyScore = 0;
    playOlympiad = false;

    showBriefing(title, desc, baseLimit);
}

function showBriefing(title, desc, count) {
    gameContent.innerHTML = `
        <h1>🚀 ПОДГОТОВКА К ЗАПУСКУ 🚀</h1><h2>Модуль: ${title}</h2>
        <div class="info-box"><strong>📖 Справка бортового компьютера:</strong><br>${desc}</div>
        <p style="color: #60a5fa">Базовый экзаменационный блок содержит <b>${count} вопросов</b>.</p>
        <button class="btn" onclick="showQuestion()">АКТИВИРОВАТЬ ПРЫЖОК</button>
    `;
}

let currentShuffledCorrectIndex = -1;

function showQuestion() {
    // Проверка окончания базового блока
    if (!playOlympiad && currentIdx >= baseLimit) {
        showOlyChoice();
        return;
    }
    // Проверка окончания олимпиадного блока
    if (playOlympiad && currentIdx >= activePool.length) {
        showFinal();
        return;
    }

    const qObj = activePool[currentIdx];
    const progressPct = ((currentIdx) / activePool.length) * 100;

    // Определяем тег раунда
    let tagHtml = '';
    if (!playOlympiad) {
        // Базовый блок: делим на три части
        const part = Math.floor(baseLimit / 3);
        const remainder = baseLimit % 3;
        let roundNum = 1;
        if (currentIdx < part) roundNum = 1;
        else if (currentIdx < 2 * part + (remainder >= 1 ? 1 : 0)) roundNum = 2;
        else roundNum = 3;
        const roundNames = ['Прямой тест', 'Логический реверс', 'Формат ОГЭ'];
        const roundClasses = ['round1-tag', 'round2-tag', 'round3-tag'];
        const roundIcons = ['🟢', '🔴', '🔵'];
        const idx = roundNum - 1;
        tagHtml = `<span class="round-tag ${roundClasses[idx]}">${roundIcons[idx]} Раунд ${roundNum}: ${roundNames[idx]} (${currentIdx + 1}/${baseLimit})</span>`;
    } else {
        const olyCur = currentIdx - baseLimit + 1;
        const olyTot = olympiadQuestions.length;
        tagHtml = `<span class="round-tag" style="background-color:#7c2d12; color:#fed7aa;">🏆 Раунд 4: Олимпиада (${olyCur}/${olyTot})</span>`;
    }

    // Перемешиваем варианты ответов
    const originalAnswers = qObj.a;
    const shuffled = shuffleArray(originalAnswers);
    const correctAnswerText = originalAnswers[qObj.c];
    const shuffledCorrectIdx = shuffled.indexOf(correctAnswerText);
    currentShuffledCorrectIndex = shuffledCorrectIdx;

    let html = `<div class="progress-bar"><div class="progress" style="width: ${progressPct}%"></div></div>`;
    html += tagHtml;
    html += `<h3 style="margin-top:10px; line-height:1.4;">${qObj.q}</h3>`;
    html += `<div class="options">`;
    shuffled.forEach((opt, idx) => {
        html += `<button class="option-btn" onclick="checkAnswer(${idx})">${idx + 1}) ${opt}</button>`;
    });
    html += `</div><div class="feedback" id="feedback"></div>`;
    gameContent.innerHTML = html;
}

function checkAnswer(chosenIdx) {
    const qObj = activePool[currentIdx];
    const fDiv = document.getElementById("feedback");
    const btns = document.querySelectorAll(".option-btn");
    btns.forEach(b => b.disabled = true);

    if (chosenIdx === currentShuffledCorrectIndex) {
        // Определяем, к какому счётчику добавить
        if (currentIdx < baseLimit) {
            schoolScore++;
        } else {
            olyScore++;
        }
        fDiv.innerHTML = `<span style="color:#10b981">${qObj.f}</span>`;
        btns[chosenIdx].style.background = "#065f46";
        btns[chosenIdx].style.borderColor = "#10b981";
    } else {
        fDiv.innerHTML = `<span style="color:#ef4444">❌ Ошибка! Правильный ответ под номером ${currentShuffledCorrectIndex + 1}.</span>`;
        btns[chosenIdx].style.background = "#991b1b";
        btns[chosenIdx].style.borderColor = "#ef4444";
        btns[currentShuffledCorrectIndex].style.background = "#065f46";
    }

    currentIdx++;

    // Создаём кнопку "Далее"
    const limit = baseLimit;
    let nextBtn = document.createElement("button");
    nextBtn.className = "btn";
    if (!playOlympiad) {
        if (currentIdx < limit) {
            // Определяем, какой раунд следующий, чтобы подсказать
            const part = Math.floor(limit / 3);
            const remainder = limit % 3;
            let nextRound = 1;
            if (currentIdx < part) nextRound = 1;
            else if (currentIdx < 2 * part + (remainder >= 1 ? 1 : 0)) nextRound = 2;
            else nextRound = 3;
            const nextRoundNames = ['ПРЯМОЙ ТЕСТ', 'ЛОГИЧЕСКИЙ РЕВЕРС', 'ФОРМАТ ОГЭ'];
            nextBtn.innerText = `ДАЛЕЕ (Раунд ${nextRound})`;
        } else {
            nextBtn.innerText = "ЗАВЕРШИТЬ БАЗОВЫЙ БЛОК";
        }
    } else {
        if (currentIdx < activePool.length) {
            nextBtn.innerText = "ДАЛЕЕ (Олимпиада)";
        } else {
            nextBtn.innerText = "ЗАВЕРШИТЬ ИГРУ";
        }
    }
    nextBtn.onclick = showQuestion;
    gameContent.appendChild(nextBtn);
}

function showOlyChoice() {
    gameContent.innerHTML = `
        <h2>🏁 Базовый блок завершён!</h2><p>Школьные стандарты и требования ОГЭ успешно преодолены.</p>
        <div class="info-box" style="border-color:#10b981; text-align:center;"><span style="font-size:18px;">Твой результат: <b>${schoolScore} из ${baseLimit} баллов</b>!</span></div>
        <p>Впереди скрытый уровень: <b>Высшая олимпийская лига</b>.</p>
        ${olympiadQuestions.length > 0 ? `
            <button class="btn" style="background:linear-gradient(to right, #b45309, #7c2d12); margin-right:10px;" onclick="startOlympiad()">🎯 ИДТИ НА ОЛИМПИАДУ</button>
        ` : `
            <p style="color:#9ca3af;">Олимпиадных заданий для этого режима нет.</p>
        `}
        <button class="btn" style="background:linear-gradient(to right, #4b5563, #374151);" onclick="showFinal()">🛑 ЗАВЕРШИТЬ ИГРУ</button>
    `;
}

function startOlympiad() {
    if (olympiadQuestions.length === 0) {
        showFinal();
        return;
    }
    playOlympiad = true;
    // Добавляем олимпиадные вопросы в конец активного пула
    activePool = activePool.concat(olympiadQuestions);
    // currentIdx уже равен baseLimit (после завершения базового блока)
    showQuestion();
}

function getSchoolMark(s, limit) {
    const pct = (s / limit) * 100;
    if (pct === 100) return "5+++ (Магистр ОГЭ)";
    if (pct >= 80) return "5 (Отлично)";
    if (pct >= 50) return "4 (Хорошо)";
    return "3 (Нужно повторить)";
}

function showFinal() {
    const olyLimit = olympiadQuestions.length;
    const schoolMark = getSchoolMark(schoolScore, baseLimit);
    let html = `<h1>🏁 СУПЕР-МАРАФОН ЗАВЕРШЕН! 🏁</h1><h2>Экзаменационная ведомость:</h2><div class="info-box" style="border-color: #3b82f6;">`;
    html += `<div class="result-item">🏫 <b>Школьная программа + ОГЭ:</b> <span>${schoolScore} из ${baseLimit} баллов</span> — <b style="color:#10b981">${schoolMark}</b></div>`;
    if (playOlympiad && olyLimit > 0) {
        const olyMark = olyScore === olyLimit ? "Победитель олимпиады" : (olyScore >= (olyLimit * 0.6) ? "Призёр олимпиады" : "Участник");
        html += `<div class="result-item" style="border-left:4px solid #f59e0b;">🏆 <b>Олимпиадный уровень:</b> <span>${olyScore} из ${olyLimit} баллов</span> — <b style="color:#f59e0b">${olyMark}</b></div>`;
        html += `<div class="result-item" style="background:#111827; text-align:center; margin-top:15px;">👑 <b>ОБЩИЙ ИТОГОВЫЙ СЧЁТ:</b> <span style="color:#f59e0b; font-weight:bold;">${schoolScore + olyScore} из ${baseLimit + olyLimit} баллов</span></div>`;
    } else {
        html += `<div class="result-item" style="color:#9ca3af; text-align:center;">🎯 <i>Олимпиадный раунд не был выбран или отсутствовал.</i></div>`;
    }
    html += `</div>`;
    html += renderCopyright();
    html += `<button class="btn" onclick="showMainMenu()">В ГЛАВНОЕ МЕНЮ</button>`;
    gameContent.innerHTML = html;
}

// ============================================
// 🚀 СТАРТ
// ============================================
if (checkSavedLogin()) {
    loginScreen.style.display = "none";
    gameContent.style.display = "block";
    showMainMenu();
} else {
    loginScreen.style.display = "flex";
    gameContent.style.display = "none";
}
</script>
